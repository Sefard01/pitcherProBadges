<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PitcherPro</title>
  <link rel="shortcut icon" href="/public/favicon/pitcher-icon.png" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="flex flex-col min-h-screen">
  
  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur py-4 px-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="bg-orange-500 text-black font-extrabold px-2 py-1 rounded text-sm">PITCHER</span>
        <h1 class="text-xl font-bold tracking-tight">Badge Builder Service</h1>
      </div>
      <span class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">v1.0 API</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-6 grid md:grid-cols-2 gap-8 items-start mt-6">
    
    <!-- Controls Form -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4 shadow-xl">
      <h2 class="text-lg font-semibold border-b border-slate-800 pb-2 text-orange-400">Badge Parameters</h2>
      
      <div>
        <label class="block text-xs text-slate-400 mb-1">LABEL TEXT</label>
        <input id="labelInput" type="text" value="PitcherPro" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">VALUE TEXT</label>
        <input id="valueInput" type="text" value="Auto Docs" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">VALUE COLOR</label>
          <input id="colorInput" type="color" value="#f97316" class="w-full h-10 bg-slate-950 border border-slate-800 rounded p-1 cursor-pointer">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">LABEL COLOR</label>
          <input id="labelColorInput" type="color" value="#334155" class="w-full h-10 bg-slate-950 border border-slate-800 rounded p-1 cursor-pointer">
        </div>
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">BADGE STYLE</label>
        <select id="styleInput" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
          <option value="flat">Flat (Default)</option>
          <option value="for-the-badge">For The Badge</option>
          <option value="rounded">Rounded Corners</option>
        </select>
      </div>
    </div>

    <!-- Live Preview & Snippets -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-6 shadow-xl">
      <h2 class="text-lg font-semibold border-b border-slate-800 pb-2 text-orange-400">Live Preview</h2>
      
      <div class="flex items-center justify-center p-8 bg-slate-950 border border-slate-800 rounded-lg min-h-[100px]">
        <img id="badgePreview" src="" alt="Badge Preview" />
      </div>

      <!-- Markdown Output -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs text-slate-400">MARKDOWN EMBED</label>
          <button onclick="copySnippet('markdownCode')" class="text-xs text-orange-400 hover:underline">Copy</button>
        </div>
        <textarea id="markdownCode" readonly class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs font-mono text-slate-300 h-16 resize-none"></textarea>
      </div>

      <!-- Direct Image URL -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs text-slate-400">DIRECT IMAGE URL</label>
          <button onclick="copySnippet('imageUrl')" class="text-xs text-orange-400 hover:underline">Copy</button>
        </div>
        <input id="imageUrl" readonly class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs font-mono text-slate-300">
      </div>
    </div>
  </main>
  
  <script>
    function updateBadge() {
      const label = encodeURIComponent(document.getElementById('labelInput').value || 'Badge');
      const value = encodeURIComponent(document.getElementById('valueInput').value || 'Value');
      const color = document.getElementById('colorInput').value.replace('#', '');
      const labelColor = document.getElementById('labelColorInput').value.replace('#', '');
      const style = document.getElementById('styleInput').value;
      const baseUrl = `${window.location.origin}/api/badge?label=${label}&value=${value}&color=${color}&labelColor=${labelColor}&style=${style}`;
      document.getElementById('badgePreview').src = baseUrl;
      document.getElementById('imageUrl').value = baseUrl;
      document.getElementById('markdownCode').value = `![${decodeURIComponent(label)}: ${decodeURIComponent(value)}](${baseUrl})`;
    }


    
    function copySnippet(id) {
      const el = document.getElementById(id);
      el.select();
      document.execCommand('copy');
      alert('Copied to clipboard!');
    }

    document.querySelectorAll('input, select').forEach(input => {
      input.addEventListener('input', updateBadge);
    });

    updateBadge();
  </script>
</body>
</html>
